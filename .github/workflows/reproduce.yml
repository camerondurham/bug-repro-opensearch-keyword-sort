name: Trial OpenSearch 3.0.0 keyword-sort latency

# Temporary branch only: one authorized release, no main publication or retries.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyword-sort-reproduction
  cancel-in-progress: false

jobs:
  benchmark:
    name: OpenSearch ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated runner
        run: |
          sudo sysctl -w vm.max_map_count=262144
          python3 --version
          docker --version
          free -h
          df -h /
      - name: Measure both orders in fresh containers
        run: python3 repro.py --version '${{ matrix.version }}' --output artifacts --max-seconds 780
      - name: Retain raw measurements even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  report:
    name: Validate trial and retain charts
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: benchmark-*
          path: artifacts
      - name: Validate evidence and draw every request
        run: python3 report.py --input artifacts --version 3.0.0 --output trial-results/3.0.0
      - name: Actions summary
        if: always()
        run: |
          if [ -f trial-results/3.0.0/summary.md ]; then
            cat trial-results/3.0.0/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No complete report: inspect failed benchmark job.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain standalone visual report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-report
          path: trial-results/3.0.0/
          if-no-files-found: error
          retention-days: 30
